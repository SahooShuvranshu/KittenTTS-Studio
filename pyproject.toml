[project]
name = "kitten-tts-studio"
version = "1.0.0"
description = "Local zero-shot voice cloning and speech synthesis studio powered by Kitten-TTS 2"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shuvransu", email = "contact@sahooshuvranshu.is-a.dev" }
]
license = { text = "MIT" }
dependencies = [
    "kittenml>=0.2.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "psutil>=5.9.8",
]

[project.urls]
Homepage = "https://sahooshuvranshu.github.io/KittenTTS-Studio"
Repository = "https://github.com/SahooShuvranshu/KittenTTS-Studio"
Issues = "https://github.com/SahooShuvranshu/KittenTTS-Studio/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
