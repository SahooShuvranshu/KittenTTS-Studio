[project]
name = "kitten-tts-studio"
version = "0.1.0"
description = "Industrial, unslopped local zero-shot voice cloning studio powered by Kitten-TTS 2"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shuvransu Sekhar Sahoo", email = "crystalstudiolabs@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "kittenml>=0.2.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "psutil>=5.9.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
